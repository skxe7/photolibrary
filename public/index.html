<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>archive redux</title>

<style>
<style>
body {
  margin: 0;
  font-family: Arial;
  background: #fff;
  color: #111;
}

/* top bar */
.top {
  height: 56px;
  border-bottom: 1px solid #e6e6e6;
  display: flex;
  align-items: center;
  padding: 0 18px;
  font-weight: 600;
  background: #fff;
}

/* layout */
.wrap {
  display: flex;
}

/* sidebar */
.side {
  width: 200px;
  border-right: 1px solid #eee;
  height: calc(100vh - 56px);
  padding: 10px;
}

.btn {
  padding: 10px;
  cursor: pointer;
  border-radius: 6px;
  font-size: 14px;
}

.btn:hover {
  background: #f5f5f5;
}

/* content */
.content {
  flex: 1;
  padding: 16px;
}

/* GRID как Google Photos */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 4px;
}

/* карточки БЕЗ тени */
.card {
  background: #fff;
  overflow: hidden;
}

/* плитки */
.card img,
.card video {
  width: 100%;
  display: block;
  object-fit: cover;
}

/* подпись минимальная */
.info {
  font-size: 11px;
  padding: 4px 2px;
  color: #666;
}
</style>
</style>

</head>

<body>

<div class="top">📼 archive redux</div>

<div class="wrap">

<div class="side">
  <div class="btn" onclick="filter('all')">all</div>
  <div class="btn" onclick="filter('2026')">2026</div>
  <div class="btn" onclick="filter('2025')">2025</div>
  <div class="btn" onclick="filter('photo')">photos</div>
  <div class="btn" onclick="filter('video')">videos</div>

  <a href="upload.html">upload</a>
</div>

<div class="content">
  <div class="grid" id="grid"></div>
</div>

</div>

<script>
let data = [];

async function load() {
  const res = await fetch("/files");
  data = await res.json();
  render("all");
}

function isVideo(f) {
  return ["mp4","webm","mov"].includes(f.file.split(".").pop());
}

function render(mode) {
  const g = document.getElementById("grid");
  g.innerHTML = "";

  data.forEach(item => {
    const video = isVideo(item);

    if (mode !== "all") {
      if (mode === "video" && !video) return;
      if (mode === "photo" && video) return;
      if (mode !== "video" && mode !== "photo" && item.year !== mode) return;
    }

    g.innerHTML += `
      <div class="card">
        ${
          video
          ? `<video src="/uploads/${item.file}" controls></video>`
          : `<img src="/uploads/${item.file}">`
        }
        <div class="info">
          ${item.file}
          • ${item.year}
        </div>
      </div>
    `;
  });
}

function filter(m) {
  render(m);
}

load();
</script>

</body>
</html>
</body>
</html>
