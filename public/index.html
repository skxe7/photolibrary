<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>archive redux</title>

<style>
body {
  margin: 0;
  background: #181818;
  color: white;
  font-family: Arial;
}

/* top */
.top {
  height: 56px;
  background: #202020;
  display: flex;
  align-items: center;
  padding: 0 20px;
  font-weight: bold;
}

/* layout */
.wrap {
  display: flex;
}

/* sidebar */
.side {
  width: 220px;
  background: #202020;
  height: calc(100vh - 56px);
  padding: 10px;
}

.btn {
  padding: 10px;
  margin: 5px 0;
  background: #303030;
  cursor: pointer;
}

.btn:hover {
  background: #404040;
}

/* grid */
.content {
  flex: 1;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 15px;
}

/* card */
.card {
  background: #282828;
  border-radius: 8px;
  overflow: hidden;
}

.card img, .card video {
  width: 100%;
}

.info {
  padding: 8px;
  font-size: 13px;
  color: #ccc;
}
</style>

</head>

<body>

<div class="top">📼 archive redux</div>

<div class="wrap">

<div class="side">
  <div class="btn" onclick="filter('all')">all</div>
  <div class="btn" onclick="filter('2026')">2026</div>
  <div class="btn" onclick="filter('2025')">2025</div>
  <div class="btn" onclick="filter('photo')">photos</div>
  <div class="btn" onclick="filter('video')">videos</div>

  <a href="upload.html">upload</a>
</div>

<div class="content">
  <div class="grid" id="grid"></div>
</div>

</div>

<script>
let data = [];

async function load() {
  const res = await fetch("/files");
  data = await res.json();
  render("all");
}

function isVideo(f) {
  return ["mp4","webm","mov"].includes(f.file.split(".").pop());
}

function render(mode) {
  const g = document.getElementById("grid");
  g.innerHTML = "";

  data.forEach(item => {
    const video = isVideo(item);

    if (mode !== "all") {
      if (mode === "video" && !video) return;
      if (mode === "photo" && video) return;
      if (mode !== "video" && mode !== "photo" && item.year !== mode) return;
    }

    g.innerHTML += `
      <div class="card">
        ${
          video
          ? `<video src="/uploads/${item.file}" controls></video>`
          : `<img src="/uploads/${item.file}">`
        }
        <div class="info">
          ${item.file}
          • ${item.year}
        </div>
      </div>
    `;
  });
}

function filter(m) {
  render(m);
}

load();
</script>

</body>
</html>
</body>
</html>
